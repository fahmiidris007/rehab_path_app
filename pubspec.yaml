name: rehab_path_app
description: "RehabPath - A Flutter mobile application supporting fall-prevention rehabilitation programs for community-dwelling older adults."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Navigation
  go_router: ^14.2.7

  # Local storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking (future)
  dio: ^5.7.0

  # Functional programming
  dartz: ^0.10.1

  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Form validation
  formz: ^0.7.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # URL launcher (SOS)
  url_launcher: ^6.3.0

  # Logging
  logger: ^2.4.0

  # Charts
  fl_chart: ^0.69.0

  # Calendar
  table_calendar: ^3.1.2

  # Image picker (profile avatar)
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: 2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.4
  hive_test: ^1.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/avatars/
    - assets/images/exercises/
